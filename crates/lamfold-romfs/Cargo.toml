# The romfs frontend of the lamfold stack. Clean-roomed from the public
# `-rom1fs-` on-disk format; see NOTICE and the lamfold design spec §4.

[package]
name = "lamfold-romfs"
description = "no_std clean-room Linux romfs (-rom1fs-) reader — the lamfold minimal-embedded frontend"
readme = "README.md"
keywords = ["romfs", "filesystem", "no_std", "embedded", "uefi"]
categories = ["filesystem", "no-std"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["std"]
std = ["lamfold/std"]

[dependencies]
lamfold = { workspace = true }
