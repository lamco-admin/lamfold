# Copyright 2026 Lamco Development LLC — MIT OR Apache-2.0.
# The romfs frontend of the lamfold stack. Clean-roomed from the public
# `-rom1fs-` on-disk format; see NOTICE and the lamfold design spec §4.

[package]
name = "lamfold-romfs"
description = "no_std clean-room Linux romfs (-rom1fs-) reader — the lamfold minimal-embedded frontend"
readme = "README.md"
keywords = ["romfs", "filesystem", "no_std", "embedded", "uefi"]
categories = ["filesystem", "no-std", "embedded"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/lamfold-romfs"
include = [
    "src/**/*.rs",
    "README.md",
    "NOTICE",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[features]
default = ["std"]
std = ["lamfold/std"]

[dependencies]
lamfold = { workspace = true }

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }
