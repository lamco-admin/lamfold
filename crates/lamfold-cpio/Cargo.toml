# The cpio/initramfs frontend of the lamfold stack. Reuses the permissive
# `cpio_reader` parser; see NOTICE and the lamfold design spec §4.

[package]
name = "lamfold-cpio"
description = "no_std read-only cpio and initramfs reader (chained newc and CRC archives, hard links), the lamfold initramfs frontend, from Lamco Development LLC"
readme = "README.md"
keywords = ["cpio", "initramfs", "no_std", "newc", "uefi"]
categories = ["filesystem", "no-std", "embedded"]
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/lamfold-cpio"
include = [
    "src/**/*.rs",
    "README.md",
    "CHANGELOG.md",
    "NOTICE",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[features]
# A compressed initramfs member is decoded with the matching lamfold codec;
# with one of these off, that member is refused instead.
default = ["std", "gzip", "zstd", "xz", "lz4"]
std = ["lamfold/std"]
gzip = ["lamfold/codec-deflate"]
zstd = ["lamfold/codec-zstd"]
# xz and the legacy .lzma format
xz = ["lamfold/codec-xz"]
lz4 = ["lamfold/codec-lz4"]

[dependencies]
lamfold = { workspace = true }
cpio_reader = { workspace = true }

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }
