# lamfold — read-only media filesystem stack (a metacrate workspace).
#
# One repo, many published crates: the `lamfold` substrate core plus thin
# clean-room format frontends (lamfold-iso, -udf, -squash, -erofs, …). Same
# shape as the lamco-wayland / lamco-rdp workspaces: a virtual workspace with
# members under crates/*, shared metadata in [workspace.package], and the pinned
# dependency set declared ONCE in [workspace.dependencies]. Spec:
# the lamfold design spec.

[workspace]
resolver = "2"
members = ["crates/*"]

# NOTE: no shared `version` here — each crate in crates/* declares its OWN
# version, so a fix in one crate bumps only that crate (no lockstep republish).
# See RELEASING.md. Shared metadata below stays shared.
[workspace.package]
edition = "2021"
# The honest floor of the current dependency set (ruzstd 0.8.3 needs 1.87; every
# other pin is lower). Not an artificial hold: the Debian path builds on the
# archive's *current* stable rustc (~1.96 — both the from-source `-Zbuild-std`
# binary build and a debcargo upload land in unstable/sid), so there is no
# old-stable MSRV constraint to satisfy. Bump freely as the dep floor moves.
rust-version = "1.87"
license = "MIT OR Apache-2.0"
authors = [
    "Greg Lamberson <greg@lamco.io>",
    "Lamco Development LLC <office@lamco.io>",
]
repository = "https://github.com/lamco-admin/lamfold"
homepage = "https://lamco.ai/products/lamboot/"

[workspace.dependencies]
# --- the substrate core (internal member; frontends depend on it) ---
lamfold = { path = "crates/lamfold", version = "0.1.5", default-features = false } # caret ^0.1.5: lamfold-cpio 0.1.2 needs the substrate's decode_stream; each republished frontend takes the new floor, already-published ones keep theirs and still resolve forward

# --- L2 parse substrate ---
# Every dependency below is a minimum at the version in the Debian archive
# (upstream decision 31, 2026-10-15), not an exact pin: An exact pin builds in
# Debian only while the archive holds exactly that version, while a minimum
# builds against whatever it holds. Cargo.lock records the versions we test.
# zerocopy's floor is lzokay's own (^0.8.27), one above the archive's 0.8.26;
# Debian carries a relax patch for it, as it does for lzokay.
zerocopy = { version = ">=0.8.27, <0.9", default-features = false, features = ["derive"] }

# --- L2 codec registry (all permissive no_std; members add `optional = true`) ---
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
lz4_flex = { version = "0.13.0", default-features = false, features = ["safe-decode", "safe-encode"] }
# Caret from 0.9.1, the first release with the RUSTSEC-2026-0344 fix (upstream
# decision 21: ruzstd ^0.9.1 across the LamBoot crates). Debian carries a relax
# patch until its archive has 0.9.1.
ruzstd = { version = "0.9.1", default-features = false }
lzma-rust2 = { version = "0.19.0", default-features = false, features = ["xz"] }
lzokay = { version = "2.0.1", default-features = false, features = ["decompress", "alloc"] }

# --- shepherd (integrity) ---
sha2 = { version = "0.11.0", default-features = false }

# --- L3 reused frontend parser (permissive, no_std) ---
# cpio is a trivial public archive format with a clean MIT/Apache no_std reader;
# the SDS reuses it directly rather than clean-rooming (reuse where licensing
# does not hinder). lamfold-cpio builds the tree + FoldFrontend over it.
cpio_reader = { version = "0.1.2", default-features = false }
